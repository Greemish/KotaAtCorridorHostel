spring.application.name=kota-ordering-system
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kotadb}
spring.datasource.username=${DATABASE_USERNAME:kota}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:kotaSecretKey2024VeryLongSecretForJWTSigningPurposesAtLeast512BitsRequired}
app.jwt.expiration=86400000
app.yoco.secret-key=${YOCO_SECRET_KEY:sk_test_placeholder}
app.yoco.checkout-url=https://online.yoco.com/v1/checkouts/
app.yoco.refund-url=https://online.yoco.com/v1/refunds/
app.yoco.webhook-secret=${YOCO_WEBHOOK_SECRET:webhook_secret_placeholder}
app.order.throttle-window-minutes=10
app.order.throttle-max-orders=30
app.order.max-pending-orders=20
app.order.auto-cancel-minutes=30
app.operational.open-hour=10
app.operational.close-hour=22
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true
logging.level.com.kota=INFO
