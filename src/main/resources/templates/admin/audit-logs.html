<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit Logs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Audit Logs</h1>
  <div id="auditTable">
    <p class="text-muted">Loading audit logs...</p>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
async function loadAuditLogs() {
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/audit-logs?size=50&sort=createdAt,desc', {
    headers: {'Authorization': 'Bearer ' + token}
  });
  const logs = await res.json();
  if (!res.ok || !Array.isArray(logs)) {
    document.getElementById('auditTable').innerHTML = '<div class="alert alert-warning">No logs available.</div>';
    return;
  }
  const container = document.createElement('div');
  container.className = 'table-responsive';
  const table = document.createElement('table');
  table.className = 'table table-sm table-striped';
  const thead = document.createElement('thead');
  thead.className = 'table-dark';
  thead.innerHTML = '<tr><th>Action</th><th>Entity</th><th>By</th><th>Reason</th><th>Date</th></tr>';
  const tbody = document.createElement('tbody');
  logs.forEach(log => {
    const tr = document.createElement('tr');
    [
      log.action,
      (log.entityType || '') + ' #' + (log.entityId || '-'),
      log.performedBy || '-',
      log.reason || '-',
      log.createdAt ? new Date(log.createdAt).toLocaleString() : '-'
    ].forEach(text => {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(thead);
  table.appendChild(tbody);
  container.appendChild(table);
  const auditTable = document.getElementById('auditTable');
  auditTable.textContent = '';
  auditTable.appendChild(container);
}
loadAuditLogs();
</script>
</body>
</html>
