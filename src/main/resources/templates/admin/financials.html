<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Financial Reports')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Financial Reports</h1>
  <form class="row g-2 mb-4" method="get" th:action="@{/admin/financials}">
    <div class="col-auto">
      <label for="from" class="col-form-label">From:</label>
    </div>
    <div class="col-auto">
      <input type="date" class="form-control" id="from" name="from" th:value="${fromDate}">
    </div>
    <div class="col-auto">
      <label for="to" class="col-form-label">To:</label>
    </div>
    <div class="col-auto">
      <input type="date" class="form-control" id="to" name="to" th:value="${toDate}">
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary">Filter</button>
    </div>
  </form>
  <div th:if="${#lists.isEmpty(reports)}" class="alert alert-info">
    No data for the selected period.
  </div>
  <div class="table-responsive" th:unless="${#lists.isEmpty(reports)}">
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Orders</th>
          <th>Revenue</th>
          <th>COGS</th>
          <th>Gross Profit</th>
          <th>Yoco Fees</th>
          <th>Net Profit</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="report : ${reports}" th:if="${report.totalOrders > 0}">
          <td th:text="${report.date}"></td>
          <td th:text="${report.totalOrders}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(report.totalRevenue, 1, 2)}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(report.totalCogs, 1, 2)}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(report.grossProfit, 1, 2)}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(report.totalYocoFees, 1, 2)}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(report.netProfit, 1, 2)}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
