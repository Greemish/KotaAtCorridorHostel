<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Menu Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Menu Management</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">Add Item</button>
  </div>
  <div id="alertBox" class="d-none alert" role="alert"></div>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Prep (min)</th>
          <th>Available</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${menuItems}">
          <td th:text="${item.name}"></td>
          <td th:text="${item.description}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
          <td th:text="${item.preparationMinutes}"></td>
          <td>
            <span class="badge" th:classappend="${item.available} ? 'bg-success' : 'bg-danger'"
                  th:text="${item.available} ? 'Yes' : 'No'"></span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-primary"
                    th:attr="onclick='editItem(' + ${item.id} + ')'">Edit</button>
            <button class="btn btn-sm btn-outline-danger"
                    th:attr="onclick='deleteItem(' + ${item.id} + ')'">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="addItemModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Menu Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="newName">
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="newDescription" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Price (R)</label>
          <input type="number" step="0.01" class="form-control" id="newPrice">
        </div>
        <div class="mb-3">
          <label class="form-label">Prep Time (minutes)</label>
          <input type="number" class="form-control" id="newPrepTime">
        </div>
        <div class="mb-3">
          <label class="form-label">Image URL</label>
          <input type="url" class="form-control" id="newImageUrl">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="addItem()">Add</button>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const addModal = new bootstrap.Modal(document.getElementById('addItemModal'));
async function addItem() {
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/menu', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({
      name: document.getElementById('newName').value,
      description: document.getElementById('newDescription').value,
      price: parseFloat(document.getElementById('newPrice').value),
      preparationMinutes: parseInt(document.getElementById('newPrepTime').value),
      imageUrl: document.getElementById('newImageUrl').value || null
    })
  });
  addModal.hide();
  if (res.ok) window.location.reload();
  else alert('Failed to add item');
}
async function deleteItem(id) {
  if (!confirm('Delete this menu item?')) return;
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/menu/' + id, {
    method: 'DELETE',
    headers: {'Authorization': 'Bearer ' + token}
  });
  if (res.ok) window.location.reload();
  else alert('Failed to delete item');
}
function editItem(id) {
  window.location.href = '/admin/menu?edit=' + id;
}
</script>
</body>
</html>
