<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">User Management</h1>
  <div id="alertBox" class="d-none alert" role="alert"></div>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Phone</th>
          <th>Active</th>
          <th>Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="user : ${users}">
          <td th:text="${user.firstName + ' ' + user.lastName}"></td>
          <td th:text="${user.email}"></td>
          <td><span class="badge bg-secondary" th:text="${user.role}"></span></td>
          <td th:text="${user.phone}"></td>
          <td>
            <span class="badge" th:classappend="${user.active} ? 'bg-success' : 'bg-danger'"
                  th:text="${user.active} ? 'Active' : 'Inactive'"></span>
          </td>
          <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></td>
          <td>
            <button class="btn btn-sm btn-outline-primary"
                    th:attr="onclick='editUser(' + ${user.id} + ', \'' + ${user.firstName} + '\', \'' + ${user.lastName} + '\', \'' + ${user.role} + '\', ' + ${user.active} + ')'">
              Edit
            </button>
            <button class="btn btn-sm btn-outline-danger"
                    th:attr="onclick='deleteUser(' + ${user.id} + ')'">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="editUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editUserId">
        <div class="mb-3">
          <label for="editFirstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="editFirstName">
        </div>
        <div class="mb-3">
          <label for="editLastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="editLastName">
        </div>
        <div class="mb-3">
          <label for="editRole" class="form-label">Role</label>
          <select class="form-select" id="editRole">
            <option value="STUDENT">Student</option>
            <option value="STAFF">Staff</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="editActive">
          <label class="form-check-label" for="editActive">Active</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveUser()">Save</button>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
function editUser(id, firstName, lastName, role, active) {
  document.getElementById('editUserId').value = id;
  document.getElementById('editFirstName').value = firstName;
  document.getElementById('editLastName').value = lastName;
  document.getElementById('editRole').value = role;
  document.getElementById('editActive').checked = active;
  modal.show();
}
async function saveUser() {
  const id = document.getElementById('editUserId').value;
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/users/' + id, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({
      firstName: document.getElementById('editFirstName').value,
      lastName: document.getElementById('editLastName').value,
      role: document.getElementById('editRole').value,
      active: document.getElementById('editActive').checked
    })
  });
  modal.hide();
  if (res.ok) window.location.reload();
  else alert('Failed to update user');
}
async function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/users/' + id, {
    method: 'DELETE',
    headers: {'Authorization': 'Bearer ' + token}
  });
  if (res.ok) window.location.reload();
  else alert('Failed to delete user');
}
</script>
</body>
</html>
