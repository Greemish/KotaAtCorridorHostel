<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
<main class="container">
  <section class="row justify-content-center">
    <article class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h1 class="card-title h3 text-center mb-4">Kota at Corridor Hostel</h1>
          <h2 class="h5 text-center text-muted mb-4">Sign in to your account</h2>
          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid email or password.
          </div>
          <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been logged out.
          </div>
          <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
              <label for="username" class="form-label">Email address</label>
              <input type="email" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
          <hr>
          <p class="text-center mb-0">
            No account? <a th:href="@{/register}">Register here</a>
          </p>
        </div>
      </div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
