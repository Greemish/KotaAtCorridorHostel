<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
<main class="container">
  <section class="row justify-content-center">
    <article class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-4">
          <h1 class="card-title h3 text-center mb-4">Create Student Account</h1>
          <div id="alertBox" class="d-none alert" role="alert"></div>
          <form id="registerForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
          <hr>
          <p class="text-center mb-0">
            Already have an account? <a th:href="@{/login}">Login here</a>
          </p>
        </div>
      </div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const data = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value
  };
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (res.ok) {
      localStorage.setItem('jwt', json.token);
      window.location.href = '/student/dashboard';
    } else {
      showAlert(json.message || 'Registration failed', 'danger');
    }
  } catch (err) {
    showAlert('An error occurred. Please try again.', 'danger');
  }
});
function showAlert(msg, type) {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.className = 'alert alert-' + type;
}
</script>
</body>
</html>
