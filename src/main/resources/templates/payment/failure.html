<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payment Failed')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
  <div class="card mx-auto shadow" style="max-width:500px">
    <div class="card-body p-5">
      <h1 class="text-danger mb-3">Payment Failed</h1>
      <p class="lead">Your payment could not be processed. Please try again.</p>
      <div class="d-flex gap-2 justify-content-center">
        <a th:href="@{/student/cart}" class="btn btn-primary">Try Again</a>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
