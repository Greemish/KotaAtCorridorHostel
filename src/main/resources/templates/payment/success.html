<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payment Successful')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
  <div class="card mx-auto shadow" style="max-width:500px">
    <div class="card-body p-5">
      <h1 class="text-success mb-3">Payment Successful!</h1>
      <p class="lead">Your order has been placed and payment confirmed.</p>
      <div th:if="${order != null}" class="mb-3">
        <p>Order Number: <strong th:text="${order.orderNumber}"></strong></p>
        <p>Total Paid: <strong th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></strong></p>
      </div>
      <div class="d-flex gap-2 justify-content-center">
        <a th:if="${order != null}" th:href="@{/student/orders/{id}(id=${order.id})}" class="btn btn-primary">Track Order</a>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>localStorage.removeItem('cart');</script>
</body>
</html>
