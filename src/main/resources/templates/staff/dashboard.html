<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Staff Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container-fluid py-4">
  <h1 class="mb-4">Staff Dashboard</h1>
  <div id="newOrderAlert" class="alert alert-warning d-none" role="alert">
    New order received!
  </div>
  <div class="row">
    <section class="col-lg-8">
      <h2 class="h5">Active Orders</h2>
      <div class="table-responsive">
        <table class="table table-bordered" id="ordersTable">
          <thead class="table-dark">
            <tr>
              <th>Order #</th>
              <th>Student</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Queue</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="order : ${orders}">
              <td th:text="${order.orderNumber}"></td>
              <td th:text="${order.student.firstName + ' ' + order.student.lastName}"></td>
              <td>
                <ul class="list-unstyled mb-0">
                  <li th:each="item : ${order.orderItems}" th:text="${item.menuItem.name + ' x' + item.quantity}"></li>
                </ul>
              </td>
              <td th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
              <td><span class="badge bg-info" th:text="${order.status}"></span></td>
              <td th:text="${order.queuePosition != null ? '#' + order.queuePosition : '-'}"></td>
              <td>
                <div class="btn-group">
                  <button class="btn btn-sm btn-success"
                          th:attr="onclick='updateStatus(' + ${order.id} + ', \'PREPARING\')'">
                    Preparing
                  </button>
                  <button class="btn btn-sm btn-primary"
                          th:attr="onclick='updateStatus(' + ${order.id} + ', \'READY\')'">
                    Ready
                  </button>
                  <button class="btn btn-sm btn-dark"
                          th:attr="onclick='updateStatus(' + ${order.id} + ', \'COMPLETED\')'">
                    Done
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <aside class="col-lg-4">
      <h2 class="h5">Low Stock Alerts</h2>
      <div th:if="${#lists.isEmpty(stockAlerts)}" class="alert alert-success">
        All stock levels are fine.
      </div>
      <ul class="list-group" th:unless="${#lists.isEmpty(stockAlerts)}">
        <li class="list-group-item list-group-item-warning" th:each="alert : ${stockAlerts}">
          <strong th:text="${alert.name}"></strong><br>
          <small th:text="'Current: ' + ${alert.currentStock} + ' ' + ${alert.unit} + ' | Reorder at: ' + ${alert.reorderPoint}"></small>
        </li>
      </ul>
    </aside>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/websocket.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
async function updateStatus(orderId, status) {
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/staff/orders/' + orderId + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({status})
  });
  if (res.ok) window.location.reload();
  else alert('Failed to update status');
}
connectStaffOrders(function(msg) {
  document.getElementById('newOrderAlert').classList.remove('d-none');
  document.getElementById('newOrderAlert').textContent = 'New order received: ' + msg.orderNumber;
  setTimeout(() => document.getElementById('newOrderAlert').classList.add('d-none'), 5000);
});
</script>
</body>
</html>
