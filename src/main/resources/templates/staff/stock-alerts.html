<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Stock Alerts')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Low Stock Alerts</h1>
  <div th:if="${#lists.isEmpty(alerts)}" class="alert alert-success">
    All ingredient stock levels are above reorder points.
  </div>
  <div class="table-responsive" th:unless="${#lists.isEmpty(alerts)}">
    <table class="table table-bordered table-hover">
      <thead class="table-warning">
        <tr>
          <th>Ingredient</th>
          <th>Current Stock</th>
          <th>Reorder Point</th>
          <th>Unit</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="alert : ${alerts}" class="table-warning">
          <td th:text="${alert.name}"></td>
          <td th:text="${alert.currentStock}"></td>
          <td th:text="${alert.reorderPoint}"></td>
          <td th:text="${alert.unit}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <a th:href="@{/staff/dashboard}" class="btn btn-outline-secondary mt-3">Back to Dashboard</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
