<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Welcome Back!</h1>
  <section class="row g-3 mb-4">
    <article class="col-md-4">
      <div class="card text-bg-primary">
        <div class="card-body">
          <h5 class="card-title">Browse Menu</h5>
          <p class="card-text">Order fresh kota rolls.</p>
          <a th:href="@{/student/menu}" class="btn btn-light">View Menu</a>
        </div>
      </div>
    </article>
    <article class="col-md-4">
      <div class="card text-bg-success">
        <div class="card-body">
          <h5 class="card-title">My Cart</h5>
          <p class="card-text">View your cart and checkout.</p>
          <a th:href="@{/student/cart}" class="btn btn-light">Open Cart</a>
        </div>
      </div>
    </article>
    <article class="col-md-4">
      <div class="card text-bg-info">
        <div class="card-body">
          <h5 class="card-title">Order History</h5>
          <p class="card-text">Track your past orders.</p>
          <a th:href="@{/student/orders}" class="btn btn-light">View Orders</a>
        </div>
      </div>
    </article>
  </section>
  <section>
    <h2 class="h5 mb-3">Recent Orders</h2>
    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
      No orders yet. <a th:href="@{/student/menu}">Browse the menu</a> to get started.
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Status</th>
            <th>Total</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}">
            <td th:text="${order.orderNumber}"></td>
            <td><span class="badge bg-secondary" th:text="${order.status}"></span></td>
            <td th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
            <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
            <td>
              <a th:href="@{/student/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Track</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
