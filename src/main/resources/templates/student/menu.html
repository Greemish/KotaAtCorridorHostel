<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Menu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Our Menu</h1>
  <div th:if="${#lists.isEmpty(menuItems)}" class="alert alert-info">
    No menu items available at this time.
  </div>
  <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(menuItems)}">
    <article class="col" th:each="item : ${menuItems}">
      <div class="card h-100 shadow-sm">
        <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" class="card-img-top" alt="Menu item image" style="height:200px;object-fit:cover">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title" th:text="${item.name}"></h5>
          <p class="card-text text-muted flex-grow-1" th:text="${item.description}"></p>
          <p class="card-text fw-bold text-success" th:text="'R' + ${#numbers.formatDecimal(item.price, 1, 2)}"></p>
          <p class="card-text small" th:if="${item.preparationMinutes != null}">
            Prep time: <span th:text="${item.preparationMinutes}"></span> min
          </p>
          <button class="btn btn-primary mt-auto"
                  th:attr="onclick='addToCart(' + ${item.id} + ', \'' + ${item.name} + '\', ' + ${item.price} + ')'">
            Add to Cart
          </button>
        </div>
      </div>
    </article>
  </div>
  <div class="position-fixed bottom-0 end-0 m-3">
    <a th:href="@{/student/cart}" class="btn btn-success btn-lg shadow">
      Cart <span id="cartCount" class="badge bg-white text-success">0</span>
    </a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
