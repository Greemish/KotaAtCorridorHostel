<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order History')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Order History</h1>
  <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
    No orders found. <a th:href="@{/student/menu}">Place your first order</a>.
  </div>
  <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Order #</th>
          <th>Status</th>
          <th>Total</th>
          <th>Queue</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="order : ${orders}">
          <td th:text="${order.orderNumber}"></td>
          <td><span class="badge bg-secondary" th:text="${order.status}"></span></td>
          <td th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
          <td th:text="${order.queuePosition != null ? '#' + order.queuePosition : '-'}"></td>
          <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
          <td>
            <a th:href="@{/student/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Track</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
