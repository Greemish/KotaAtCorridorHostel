<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Status')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Order Status</h1>
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title" th:text="'Order: ' + ${order.orderNumber}"></h5>
      <p class="card-text">
        Status: <span id="orderStatus" class="badge bg-primary fs-6" th:text="${order.status}"></span>
      </p>
      <p class="card-text" th:if="${order.queuePosition != null}">
        Queue Position: <strong id="queuePosition" th:text="${order.queuePosition}"></strong>
      </p>
      <p class="card-text">
        Total: <strong th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></strong>
      </p>
    </div>
  </div>
  <section>
    <h2 class="h5">Order Items</h2>
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between" th:each="item : ${order.orderItems}">
        <span th:text="${item.menuItem.name} + ' x' + ${item.quantity}"></span>
        <span th:text="'R' + ${#numbers.formatDecimal(item.unitPrice.multiply(new java.math.BigDecimal(item.quantity)), 1, 2)}"></span>
      </li>
    </ul>
  </section>
  <div class="mt-3">
    <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/websocket.js}"></script>
<script th:inline="javascript">
const orderId = [[${order.id}]];
connectOrderStatus(orderId, function(msg) {
  document.getElementById('orderStatus').textContent = msg.status;
  if (msg.queuePosition) {
    document.getElementById('queuePosition').textContent = msg.queuePosition;
  }
});
</script>
</body>
</html>
