<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Inventory Management</h1>
  <div th:unless="${#lists.isEmpty(alerts)}" class="alert alert-warning" role="alert">
    <strong>Low Stock Warning:</strong>
    <span th:each="a, iter : ${alerts}" th:text="${a.name + (iter.last ? '' : ', ')}"></span>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Ingredient</th>
          <th>Current Stock</th>
          <th>Unit</th>
          <th>Reorder Point</th>
          <th>Cost/Unit</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="ingredient : ${ingredients}">
          <td th:text="${ingredient.name}"></td>
          <td th:text="${ingredient.currentStock}"></td>
          <td th:text="${ingredient.unit}"></td>
          <td th:text="${ingredient.reorderPoint}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(ingredient.costPerUnit, 1, 4)}"></td>
          <td>
            <span class="badge" th:classappend="${ingredient.lowStock} ? 'bg-warning text-dark' : 'bg-success'"
                  th:text="${ingredient.lowStock} ? 'Low' : 'OK'"></span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-primary"
                    th:attr="onclick='adjustStock(' + ${ingredient.id} + ')'">
              Adjust
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="adjustModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Adjust Stock</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="adjustIngredientId">
        <div class="mb-3">
          <label class="form-label">Quantity Change (positive = add, negative = remove)</label>
          <input type="number" class="form-control" id="adjustQuantity" step="0.01">
        </div>
        <div class="mb-3">
          <label class="form-label">Reason</label>
          <input type="text" class="form-control" id="adjustReason">
        </div>
        <div class="mb-3">
          <label class="form-label">Transaction Type</label>
          <select class="form-select" id="adjustType">
            <option value="PURCHASE">Purchase</option>
            <option value="ADJUSTMENT">Adjustment</option>
            <option value="WASTE">Waste</option>
            <option value="RETURN">Return</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="submitAdjustment()">Save</button>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const adjustModal = new bootstrap.Modal(document.getElementById('adjustModal'));
function adjustStock(id) {
  document.getElementById('adjustIngredientId').value = id;
  adjustModal.show();
}
async function submitAdjustment() {
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/inventory/adjust', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({
      ingredientId: parseInt(document.getElementById('adjustIngredientId').value),
      quantity: parseFloat(document.getElementById('adjustQuantity').value),
      reason: document.getElementById('adjustReason').value,
      transactionType: document.getElementById('adjustType').value
    })
  });
  adjustModal.hide();
  if (res.ok) window.location.reload();
  else alert('Failed to adjust stock');
}
</script>
</body>
</html>
