<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Payment Transactions</h1>
  <div id="alertBox" class="d-none alert" role="alert"></div>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Order #</th>
          <th>Amount</th>
          <th>Yoco Fee</th>
          <th>Status</th>
          <th>Card</th>
          <th>Date</th>
          <th>Refund</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="tx : ${transactions}">
          <td th:text="${tx.orderNumber}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(tx.amount, 1, 2)}"></td>
          <td th:text="'R' + ${#numbers.formatDecimal(tx.yocoFee, 1, 2)}"></td>
          <td><span class="badge bg-success" th:text="${tx.status}"></span></td>
          <td th:text="${tx.cardLast4 != null ? '**** ' + tx.cardLast4 : '-'}"></td>
          <td th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy HH:mm')}"></td>
          <td>
            <button class="btn btn-sm btn-outline-warning"
                    th:if="${tx.status == 'SUCCEEDED'}"
                    th:attr="onclick='refund(' + ${tx.id} + ', ' + ${tx.amount} + ')'">
              Refund
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="refundModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Process Refund</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="refundTxId">
        <div class="mb-3">
          <label class="form-label">Refund Amount (R)</label>
          <input type="number" step="0.01" class="form-control" id="refundAmount">
        </div>
        <div class="mb-3">
          <label class="form-label">Reason</label>
          <input type="text" class="form-control" id="refundReason">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="submitRefund()">Process Refund</button>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const refundModal = new bootstrap.Modal(document.getElementById('refundModal'));
function refund(txId, maxAmount) {
  document.getElementById('refundTxId').value = txId;
  document.getElementById('refundAmount').value = maxAmount;
  refundModal.show();
}
async function submitRefund() {
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/admin/payments/refund', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({
      paymentTransactionId: parseInt(document.getElementById('refundTxId').value),
      amount: parseFloat(document.getElementById('refundAmount').value),
      reason: document.getElementById('refundReason').value
    })
  });
  refundModal.hide();
  if (res.ok) { alert('Refund processed.'); window.location.reload(); }
  else alert('Refund failed.');
}
</script>
</body>
</html>
