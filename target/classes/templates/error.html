<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
  <div class="card mx-auto shadow" style="max-width:500px">
    <div class="card-body p-5">
      <h1 class="text-danger mb-3" th:text="${status != null ? status + ' Error' : 'Error'}"></h1>
      <p class="lead" th:text="${message != null ? message : 'An unexpected error occurred.'}"></p>
      <a th:href="@{/}" class="btn btn-primary">Go Home</a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
