<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Queue Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Queue Management</h1>
  <p class="text-muted">Total in queue: <strong th:text="${queue.totalPending}"></strong></p>
  <div th:if="${#lists.isEmpty(queue.orders)}" class="alert alert-info">
    Queue is empty.
  </div>
  <div id="queueList" th:unless="${#lists.isEmpty(queue.orders)}">
    <div class="card mb-2" th:each="order : ${queue.orders}" th:attr="data-order-id=${order.id}">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="'#' + ${order.queuePosition} + ' - ' + ${order.orderNumber}"></strong><br>
          <span class="text-muted" th:text="${order.studentName}"></span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-info" th:text="${order.status}"></span>
          <span th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span>
          <button class="btn btn-sm btn-outline-secondary move-up">Up</button>
          <button class="btn btn-sm btn-outline-secondary move-down">Down</button>
        </div>
      </div>
    </div>
  </div>
  <button class="btn btn-primary mt-3" onclick="saveQueueOrder()">Save Queue Order</button>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
document.querySelectorAll('.move-up').forEach(btn => {
  btn.addEventListener('click', function() {
    const card = this.closest('.card');
    if (card.previousElementSibling) card.parentNode.insertBefore(card, card.previousElementSibling);
  });
});
document.querySelectorAll('.move-down').forEach(btn => {
  btn.addEventListener('click', function() {
    const card = this.closest('.card');
    if (card.nextElementSibling) card.parentNode.insertBefore(card.nextElementSibling, card);
  });
});
async function saveQueueOrder() {
  const ids = Array.from(document.querySelectorAll('[data-order-id]'))
    .map(el => parseInt(el.getAttribute('data-order-id')));
  const token = localStorage.getItem('jwt');
  const res = await fetch('/api/staff/queue/reorder', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
    body: JSON.stringify({orderedOrderIds: ids, reason: 'Manual reorder'})
  });
  if (res.ok) alert('Queue order saved successfully.');
  else alert('Failed to save queue order.');
}
</script>
</body>
</html>
