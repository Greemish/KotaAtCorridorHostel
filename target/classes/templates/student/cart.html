<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <h1 class="mb-4">Your Cart</h1>
  <div id="emptyCart" class="alert alert-info d-none">
    Your cart is empty. <a th:href="@{/student/menu}">Browse the menu</a>.
  </div>
  <div id="cartContent">
    <div class="table-responsive">
      <table class="table" id="cartTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody id="cartTableBody"></tbody>
        <tfoot>
          <tr>
            <td colspan="3" class="fw-bold text-end">Total:</td>
            <td class="fw-bold" id="cartTotal">R0.00</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="mb-3">
      <label for="orderNotes" class="form-label">Special Instructions</label>
      <textarea class="form-control" id="orderNotes" rows="2" placeholder="Any special requests?"></textarea>
    </div>
    <div class="d-flex justify-content-between">
      <a th:href="@{/student/menu}" class="btn btn-outline-secondary">Continue Shopping</a>
      <button class="btn btn-success" onclick="checkout()">Proceed to Payment</button>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
async function checkout() {
  const cart = getCart();
  if (cart.length === 0) return;
  const items = cart.map(i => ({menuItemId: i.id, quantity: i.quantity}));
  const notes = document.getElementById('orderNotes').value;
  const token = localStorage.getItem('jwt');
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({items, notes})
    });
    const data = await res.json();
    if (res.ok) {
      clearCart();
      window.location.href = data.redirectUrl;
    } else {
      alert(data.message || 'Could not place order. Please try again.');
    }
  } catch (e) {
    alert('Network error. Please try again.');
  }
}
</script>
</body>
</html>
